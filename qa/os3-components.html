<!doctype html><html lang="ru" class="os3 cb-apple-light"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OS3 — каталог компонентов</title><link rel="stylesheet" href="../os3.css"><style>body{max-width:960px;margin:24px auto;padding:16px;font:16px system-ui;background:var(--os-bg);color:var(--os-text)}main{display:grid;gap:24px}.example{padding:24px;border:1px solid var(--os-border);border-radius:16px}button{padding:12px}h1{font-size:28px}</style><h1>Компоненты OS3 · изолированные состояния</h1><p>Синтетические примеры общих функций отображения. Полные экраны: <a href="os3-responsive.html">локальный стенд</a> после генерации fixture.</p><button id="theme">Сменить тему</button><main id="gallery"></main><script src="../os3-components.js"></script><script src="../os3-charts.js"></script><script>
const C=CampBoxComponents;document.getElementById('gallery').innerHTML=[['Нет данных',C.state('empty','Записей нет','Измените период или внесите первый факт.')],['Ошибка',C.state('error','Не удалось сохранить','Данные остаются в форме. Повторите попытку после восстановления соединения.')],['Загрузка',C.state('loading','Загружаем данные','Показатели появятся после ответа сервера.')],['Показатели',C.metric('Нулевой факт',0)+C.metric('Нет факта',null)],['Раскрытие',C.disclosure('Пояснение к расчёту','<p>Клавиатура: Tab и Enter. Исходные данные не изменяются.</p>')],['Длинная подпись и пропуски',CampBoxCharts.chart({labels:['Первый день с длинной подписью','2','3','4','5','6','7'],series:[{name:'Факт',values:[0,2,null,4,null,5,7],tone:'positive'}]})]].map(([title,body])=>'<section class="example"><h2>'+title+'</h2>'+body+'</section>').join('');document.getElementById('theme').onclick=()=>document.documentElement.classList.toggle('cb-apple-light');
</script></html>
