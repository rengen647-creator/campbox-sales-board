name: Refined Sales UI checks
on:
  pull_request:
    paths:
      - 'index.html'
      - 'refined-ui.css'
      - 'refined-ui.js'
      - 'sw.js'
      - 'tests/refined-ui.test.cjs'
      - '.github/workflows/qa-refined-ui.yml'
  workflow_dispatch:
jobs:
  refined-ui:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JS syntax
        run: |
          node --check refined-ui.js
          node --check sw.js
          node --check ui-v13.js
          node --check finance-ledger.js
          node --check salary-v1.js
          node --check tests/refined-ui.test.cjs
      - name: UI integration and existing finance regression
        run: |
          node tests/refined-ui.test.cjs
          node tests/finance-matrix.test.cjs
          node tests/finance-payment-tabs.test.cjs
          node tests/retention-commission.test.cjs
          node tests/signed-handoff.test.cjs
