name: Pending contracts across months
on:
  pull_request:
    paths:
      - index.html
      - qa/contracts-carryover.test.cjs
      - .github/workflows/contracts-carryover-qa.yml
  push:
    branches: [main]
    paths:
      - index.html
      - qa/contracts-carryover.test.cjs
      - .github/workflows/contracts-carryover-qa.yml
jobs:
  carryover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test qa/contracts-carryover.test.cjs
