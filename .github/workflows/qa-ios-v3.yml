name: iOS V3 — layout and business regression
on:
  pull_request:
    paths:
      - 'index.html'
      - 'ui-v13.js'
      - 'ios-v3.js'
      - 'ios-v3.css'
      - 'sw.js'
      - 'tests/ios-v3-layout.test.cjs'
      - 'tests/refined-ui.test.cjs'
      - 'tests/business-ux-v2.test.cjs'
      - '.github/workflows/qa-ios-v3.yml'
  workflow_dispatch:
jobs:
  ios-v3:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax gate
        run: |
          node --check ui-v13.js
          node --check ios-v3.js
          node --check product-v2.js
          node --check refined-ui.js
          node --check finance-ledger.js
          node --check salary-v1.js
          node --check sw.js
          node --check tests/ios-v3-layout.test.cjs
      - name: Actual daily fact handler + iOS layout
        run: node tests/ios-v3-layout.test.cjs
      - name: Existing business logic regression
        run: |
          node tests/refined-ui.test.cjs
          node tests/business-ux-v2.test.cjs
          node tests/finance-matrix.test.cjs
          node tests/finance-payment-tabs.test.cjs
          node tests/retention-commission.test.cjs
          node tests/signed-handoff.test.cjs
